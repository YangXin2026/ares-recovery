name: Build ares recovery (TWRP / OrangeFox)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'twrp = TWRP 12.1 最小清单；ofox = OrangeFox fox_12.1（官方 sync 脚本）'
        required: true
        default: 'twrp'
      tree_repo:
        description: '设备树仓库'
        required: true
        default: 'AYIKxD/recovery_device_xiaomi_ares'
      tree_branch:
        description: '设备树分支'
        required: true
        default: 'Twrp-HyperOS'
      release_tag:
        description: 'Release 标签（留空=自动）'
        required: false
        default: ''
      disable_crypto:
        description: 'true = 关掉 recovery 的解密（碰不到 /data/密钥库，绝不会搞坏锁屏）'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ALLOW_MISSING_DEPENDENCIES: 'true'
      LC_ALL: C
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 8G
    steps:
      - name: 环境与磁盘（不腾空间：runner 本身有 87G+ 可用）
        run: |
          set -x
          df -h /
          free -m
          nproc
          mkdir -p $GITHUB_WORKSPACE/artifacts
          echo "start $(date) variant=${{ inputs.variant }} crypto_off=${{ inputs.disable_crypto }}" > $GITHUB_WORKSPACE/artifacts/build.log

      - name: 装依赖
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y git curl python3 zip unzip ccache
          sudo apt-get install -y openjdk-11-jdk || sudo apt-get install -y openjdk-17-jdk
          java -version 2>&1 | head -3 || true
          cat /etc/os-release | head -3
          mkdir -p ~/bin
          curl -fL --max-time 120 -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo \
            || curl -fL --max-time 120 -o ~/bin/repo https://raw.githubusercontent.com/GerritCodeReview/git-repo/stable/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$PATH"
          python3 -c "compile(open('$HOME/bin/repo').read(),'repo','exec'); print('repo OK')"
          git config --global user.name "dsh-bot"
          git config --global user.email "dsh@example.com"
          git config --global --add safe.directory '*'
          df -h /
          echo "deps done" >> $GITHUB_WORKSPACE/artifacts/build.log

      - name: 取源码（TWRP 12.1 最小清单）
        if: ${{ inputs.variant == 'twrp' }}
        run: |
          set -x
          export PATH="$HOME/bin:$PATH"
          mkdir -p ~/rec $GITHUB_WORKSPACE/artifacts && cd ~/rec
          {
            df -h
            repo init --depth=1 --no-repo-verify -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
            repo sync -c -j4 --no-clone-bundle --no-tags
            ls | head -20
            df -h
          } 2>&1 | tee -a $GITHUB_WORKSPACE/artifacts/build.log
          test -d vendor/twrp && echo "vendor/twrp OK" | tee -a $GITHUB_WORKSPACE/artifacts/build.log

      - name: 取源码（OrangeFox 官方 sync，fox_12.1）
        if: ${{ inputs.variant == 'ofox' }}
        run: |
          set -x
          export PATH="$HOME/bin:$PATH"
          mkdir -p ~/fox_sync $GITHUB_WORKSPACE/artifacts && cd ~/fox_sync
          {
            df -h
            git clone --depth 1 https://gitlab.com/OrangeFox/sync.git
            cd sync
            chmod +x orangefox_sync.sh
            echo "--- sync 仓库根目录 ---"; ls -l | head -20
            echo "--- patches/ ---"; ls -l patches/ 2>/dev/null | head -20
            echo "--- 脚本里对 diff 的引用 ---"; grep -n 'diff' orangefox_sync.sh | head -20
            cp -v patches/*.diff . 2>/dev/null || true
            cp -v legacy/patches/*.diff . 2>/dev/null || true
            echo "--- 根目录里的 diff（脚本期望的位置）---"; ls -l *.diff 2>/dev/null || echo "(空)"
            ./orangefox_sync.sh --branch 12.1 --path "$HOME/fox_12.1"
            ls ~/fox_12.1 | head -20
            df -h
          } 2>&1 | tee -a $GITHUB_WORKSPACE/artifacts/build.log

      - name: 放设备树
        run: |
          set -x
          if [ "${{ inputs.variant }}" = "ofox" ]; then D=$HOME/fox_12.1; else D=$HOME/rec; fi
          cd $D
          git clone --depth 1 -b "${{ inputs.tree_branch }}" https://github.com/${{ inputs.tree_repo }} device/xiaomi/ares
          ls device/xiaomi/ares | head -30
          grep -E "RECOVERY_AS_BOOT|BOOTIMAGE_PARTITION_SIZE|PREBUILT_KERNEL|VIRTUAL_AB|SUPER_PARTITION_SIZE" device/xiaomi/ares/BoardConfig.mk || true
          # 署我们的名：TWRP 显示的 "3.7.1_12-by XXX" 里 XXX = TW_DEVICE_VERSION（设备树里原本写的是树作者）
          grep -nE 'TW_DEVICE_VERSION|OF_MAINTAINER|FOX_VERSION' device/xiaomi/ares/*.mk || true
          sed -i '/^TW_DEVICE_VERSION/d' device/xiaomi/ares/BoardConfig.mk || true
          echo 'TW_DEVICE_VERSION := YangXin2026' >> device/xiaomi/ares/BoardConfig.mk
          if [ -f device/xiaomi/ares/twrp_ares.mk ]; then
            sed -i '/TW_DEVICE_VERSION/d' device/xiaomi/ares/twrp_ares.mk || true
            echo 'TW_DEVICE_VERSION := YangXin2026' >> device/xiaomi/ares/twrp_ares.mk
          fi
          echo "--- 署名设置后 ---"
          grep -rn 'TW_DEVICE_VERSION' device/xiaomi/ares/ || true

      - name: 橙狐模式：造 fox_ares 产品 + 构建开关
        if: ${{ inputs.variant == 'ofox' }}
        run: |
          set -x
          cd ~/fox_12.1/device/xiaomi/ares
          # 1) 橘子要 lunch fox_ares-eng，设备树里只有 twrp_ares 产品 -> 造一个 fox_ares
          cp twrp_ares.mk fox_ares.mk
          sed -i 's/PRODUCT_NAME := twrp_ares/PRODUCT_NAME := fox_ares/' fox_ares.mk
          cat >> fox_ares.mk <<'EOF'

          # ---- YangXin2026 的 OrangeFox 设备配置 ----
          OF_SCREEN_H := 2400
          OF_STATUS_H := 76
          OF_STATUS_INDENT_LEFT := 48
          OF_STATUS_INDENT_RIGHT := 48
          OF_HIDE_NOTCH := 1
          OF_CLOCK_POS := 1
          OF_FLASHLIGHT_ENABLE := 1
          OF_ENABLE_ALL_PARTITION_TOOLS := 1
          OF_PATCH_AVB20 := 1
          OF_QUICK_BACKUP_LIST := /boot;/data;
          OF_SPLASH_MAX_SIZE := 8192
          OF_MAINTAINER := YangXin2026
          EOF
          sed -i 's#twrp_ares.mk#fox_ares.mk#' AndroidProducts.mk
          echo "--- AndroidProducts.mk ---"; cat AndroidProducts.mk
          echo "--- fox_ares.mk 尾部 ---"; tail -20 fox_ares.mk
          # 2) 橘子构建开关
          cat > vendorsetup.sh <<'EOF'
          export FOX_AB_DEVICE=1
          export FOX_VIRTUAL_AB_DEVICE=1
          export FOX_BUILD_DEVICE=ares
          export OF_DEFAULT_KEYMASTER_VERSION=4.0
          export OF_FORCE_PREBUILT_KERNEL=1
          export OF_USE_LZMA_COMPRESSION=1
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          EOF
          echo "--- vendorsetup.sh ---"; cat vendorsetup.sh
          ls -l vendorsetup.sh fox_ares.mk

      - name: 加功能（中文/MTP+OTG/备份恢复/文件系统工具/状态栏与高级重启）+ 我们的署名
        run: |
          set -x
          if [ "${{ inputs.variant }}" = "ofox" ]; then D=$HOME/fox_12.1; else D=$HOME/rec; fi
          cd $D
          # 先看看这版 recovery 源码里到底认哪些开关（免得写了不存在的）
          for f in TW_EXTRA_LANGUAGES TW_DEFAULT_LANGUAGE TW_INCLUDE_NTFS_3G TW_INCLUDE_FUSE_EXFAT \
                   TW_INCLUDE_LPTOOLS TW_INCLUDE_REPACKTOOLS TW_INCLUDE_RESETPROP TW_INCLUDE_LIBRESETPROP \
                   TW_INCLUDE_FASTBOOTD TW_HAS_EDL_MODE TW_HAS_DOWNLOAD_MODE TW_EXTERNAL_STORAGE_PATH \
                   TW_SCREEN_BLANK_ON_BOOT TW_USE_TOOLBOX TW_HAS_MTP TW_INCLUDE_MTP TW_DEVICE_VERSION; do
            n=$(grep -rl "$f" bootable/recovery/ 2>/dev/null | wc -l)
            echo "  flag $f -> $n 处引用"
          done
          BC=device/xiaomi/ares/BoardConfig.mk
          cat > /tmp/twr_flags <<'EOF'

          # ---- YangXin2026 定制批次 ----
          TW_DEVICE_VERSION := YangXin2026
          TW_EXTRA_LANGUAGES := true
          TW_DEFAULT_LANGUAGE := zh_CN
          TW_INCLUDE_NTFS_3G := true
          TW_INCLUDE_FUSE_EXFAT := true
          TW_INCLUDE_LPTOOLS := true
          TW_INCLUDE_REPACKTOOLS := true
          TW_INCLUDE_RESETPROP := true
          TW_INCLUDE_LIBRESETPROP := true
          TW_INCLUDE_FASTBOOTD := true
          TW_HAS_EDL_MODE := true
          TW_HAS_DOWNLOAD_MODE := true
          TW_SCREEN_BLANK_ON_BOOT := true
          TW_USE_TOOLBOX := true
          TW_EXTERNAL_STORAGE_PATH := "/usb-otg"
          TW_EXTERNAL_STORAGE_MOUNT_POINT := "usb-otg"
          EOF
          # heredoc 内容带 YAML 缩进，去掉每行前导空格再写进 Makefile（Makefile 对前导空格敏感）
          sed 's/^[[:space:]]*//' /tmp/twr_flags >> $BC
          echo "--- 追加后（尾部 30 行）---"
          tail -30 $BC
          grep -n 'TW_DEVICE_VERSION' $BC

      - name: 加装解密守卫（能解就解，不能解就锁死；手输密码上限 3 次）
        if: ${{ inputs.disable_crypto == false }}
        run: |
          set -x
          if [ "${{ inputs.variant }}" = "ofox" ]; then D=$HOME/fox_12.1; else D=$HOME/rec; fi
          cd $D/device/xiaomi/ares
          mkdir -p recovery/root/system/bin
          cat > recovery/root/system/bin/ares-crypto-guard.sh <<'EOS'
          #!/system/bin/sh
          # ares 守卫式解密策略（用户定的规则）：
          #   1) 先备份 /metadata（160K 左右），动密钥库之前留退路
          #   2) 判定 ROM 世代：AIDL keymint（一般 A14/15/16）→ 我们这套 HIDL keymaster@4.0
          #      根本包不开它的 key blob，直接锁死，绝不尝试（不碰 /data、不碰 key blob）
          #   3) HIDL 世代（A13 一类）→ 放开，允许用户手动输密码
          #   4) 手动尝试由 watchdog 计数，连续 3 次不对就把解密彻底关掉
          LOG=/tmp/ares-crypto-guard.log
          STATE=/tmp/ares-crypto-state
          CNT=/tmp/ares-crypto-fails
          mkdir -p /tmp; : > $LOG
          log() { echo "[guard] $*" >> $LOG; }
          log "run $(date)"

          # 备份 metadata（只做一次）
          if [ ! -f /tmp/metadata.bak ]; then
            if dd if=/dev/block/by-name/metadata of=/tmp/metadata.bak bs=4096 2>/dev/null; then
              log "metadata 已备份 $(wc -c < /tmp/metadata.bak) B"
            else
              log "metadata 备份失败（继续，不影响策略）"
            fi
          fi

          # ROM 世代判定
          VREL=$(getprop ro.vendor.build.version.release)
          SDK=$(getprop ro.vendor.build.version.sdk)
          if [ -z "$VREL" ] && [ -f /vendor/build.prop ]; then
            VREL=$(grep -m1 '^ro.vendor.build.version.release=' /vendor/build.prop | cut -d= -f2)
            SDK=$(grep -m1 '^ro.vendor.build.version.sdk=' /vendor/build.prop | cut -d= -f2)
          fi
          KEYMINT=0
          ls /vendor/bin/hw 2>/dev/null | grep -qi keymint && KEYMINT=1
          grep -qiE 'keymint' /vendor/etc/vintf/manifest.xml 2>/dev/null && KEYMINT=1
          log "rom: release=$VREL sdk=$SDK keymint=$KEYMINT"

          lock_crypto() {
            log "-> 锁死解密：移走 recovery 里的 keymaster/gatekeeper，让它根本没法尝试"
            for s in android.hardware.keymaster@4.0-service.beanpod \
                     android.hardware.keymaster@4.0-service.mitee \
                     android.hardware.keymaster@4.0-service \
                     android.hardware.gatekeeper@1.0-service; do
              rm -f /system/bin/$s
              stop $s 2>/dev/null
            done
            echo lock > $STATE
          }

          # 有 SDK 就按 SDK 判；没有就靠 keymint 痕迹判
          if [ "$KEYMINT" = "1" ] || { [ -n "$SDK" ] && [ "$SDK" -ge 33 ] && [ "$KEYMINT" = "1" ]; }; then
            log "-> AIDL keymint / A14+ 世代：不尝试解密"
            lock_crypto
          elif [ -n "$SDK" ] && [ "$SDK" -ge 34 ]; then
            log "-> SDK=$SDK (A14+)：不尝试解密"
            lock_crypto
          else
            echo allow > $STATE
            echo 0 > $CNT
            log "-> HIDL 世代：允许用户手动输密码（最多 3 次）"
          fi
          EOS
          chmod 755 recovery/root/system/bin/ares-crypto-guard.sh

          cat > recovery/root/system/bin/ares-crypto-watchdog.sh <<'EOS'
          #!/system/bin/sh
          # 盯着 TWRP 日志数解密失败次数：连续 3 次不对 -> 锁死解密并留下提示
          LOG=/tmp/ares-crypto-guard.log
          CNT=/tmp/ares-crypto-fails
          STATE=/tmp/ares-crypto-state
          [ -f "$STATE" ] || exit 0
          [ "$(cat $STATE 2>/dev/null)" = "allow" ] || exit 0
          [ -f "$CNT" ] || echo 0 > $CNT
          i=0
          while [ $i -lt 900 ]; do
            sleep 2; i=$((i + 1))
            [ "$(cat $STATE 2>/dev/null)" = "lock" ] && exit 0
            if [ -f /tmp/recovery.log ]; then
              n=$(grep -ciE 'Failed to decrypt|password failed|Unable to decrypt|decrypt.*failed' /tmp/recovery.log 2>/dev/null)
              [ -z "$n" ] && n=0
              echo "$n" > $CNT
              if [ "$n" -ge 3 ]; then
                echo "[watchdog] 解密连续失败 $n 次 -> 关掉解密功能" >> $LOG
                for s in android.hardware.keymaster@4.0-service.beanpod \
                         android.hardware.keymaster@4.0-service.mitee \
                         android.hardware.keymaster@4.0-service \
                         android.hardware.gatekeeper@1.0-service; do
                  rm -f /system/bin/$s
                  stop $s 2>/dev/null
                done
                echo lock > $STATE
                echo "解密已关闭（3 次密码错误）" > /tmp/ares-crypto-msg
                exit 0
              fi
            fi
          done
          EOS
          chmod 755 recovery/root/system/bin/ares-crypto-watchdog.sh

          cat >> recovery/root/init.recovery.mt6893.rc <<'EOS'

          on early-init
              exec -- /system/bin/ares-crypto-guard.sh
          on fs
              exec -- /system/bin/ares-crypto-guard.sh
          on post-fs
              exec -- /system/bin/ares-crypto-guard.sh
              exec -- /system/bin/ares-crypto-watchdog.sh
          EOS
          echo "--- guard 装好了 ---"
          ls -l recovery/root/system/bin/ares-crypto-*.sh
          tail -10 recovery/root/init.recovery.mt6893.rc

      - name: 关掉解密（安全模式：不碰密钥库）
        if: ${{ inputs.disable_crypto }}
        run: |
          set -x
          if [ "${{ inputs.variant }}" = "ofox" ]; then D=$HOME/fox_12.1; else D=$HOME/rec; fi
          cd $D/device/xiaomi/ares
          cp BoardConfig.mk BoardConfig.mk.bak
          sed -i 's/^TW_INCLUDE_CRYPTO.*/TW_INCLUDE_CRYPTO := false/' BoardConfig.mk || true
          sed -i 's/^TW_INCLUDE_FBE.*/TW_INCLUDE_FBE := false/' BoardConfig.mk || true
          sed -i 's/^TW_INCLUDE_FBE_METADATA_DECRYPT.*/TW_INCLUDE_FBE_METADATA_DECRYPT := false/' BoardConfig.mk || true
          sed -i 's/^TW_INCLUDE_CRYPTO_FBE.*/TW_INCLUDE_CRYPTO_FBE := false/' BoardConfig.mk || true
          echo "--- 改动前后差异 ---"; diff -u BoardConfig.mk.bak BoardConfig.mk || true
          echo "--- 现在这些开关是 ---"; grep -nE 'TW_INCLUDE_CRYPTO|TW_INCLUDE_FBE|METADATA_DECRYPT' BoardConfig.mk || true
          # 把恢复树自带的 keymaster/gatekeeper 预编件挪走，避免它去碰 TEE
          rm -rf recovery/root/system/bin/android.hardware.keymaster* || true
          rm -rf recovery/root/system/bin/android.hardware.gatekeeper* || true
          ls recovery/root/system/bin/ 2>/dev/null | head -20 || true
          # 橙狐侧再补一个变量
          if [ "${{ inputs.variant }}" = "ofox" ]; then
            echo 'export OF_NO_CRYPTO=1' >> vendorsetup.sh
            grep -n . vendorsetup.sh || true
          fi

      - name: 编译
        run: |
          set -x
          if [ "${{ inputs.variant }}" = "ofox" ]; then
            D=$HOME/fox_12.1
            LUNCH=fox_ares-eng
          else
            D=$HOME/rec
            LUNCH=twrp_ares-eng
          fi
          cd $D
          export PATH=/usr/lib/ccache:$PATH
          # 关键：envsetup.sh / orangefox_envsetup 里有一堆返回非 0 的无害命令，
          # GitHub 默认 bash -e 会让整个步骤当场被杀（日志停在 source 中间、一行都没编）-> 先关 -e
          set +e
          source build/envsetup.sh
          echo "envsetup rc=$?"
          echo "lunch target = $LUNCH"
          lunch $LUNCH
          LRC=$?
          echo "lunch rc=$LRC"
          if [ "$LRC" != "0" ]; then
            echo "!! lunch 失败，列出可用目标："
            lunch 2>&1 | head -60
            exit 1
          fi
          set -e
          mka adbd bootimage -j4 2>&1 | tail -60
          echo "=== out 目录 ==="
          find out/target/product/ares -maxdepth 1 -name '*.img' -o -maxdepth 1 -name '*.zip' 2>/dev/null | head
          ls -lh out/target/product/ares/ 2>/dev/null | head -20
          df -h /

      - name: 产物体检（boot 布局 / ramdisk 压缩格式 —— 起不来全靠这个定位）
        if: always()
        run: |
          set -x
          if [ "${{ inputs.variant }}" = "ofox" ]; then D=$HOME/fox_12.1; else D=$HOME/rec; fi
          cd $D || exit 0
          OUT=$GITHUB_WORKSPACE/artifacts/boot_analysis.txt
          python3 - "$D" > $OUT 2>&1 <<'PYEOF'
          import glob, os, struct, sys, zlib
          root = sys.argv[1]
          def look(p):
              b = open(p, 'rb').read()
              print(f"== {os.path.relpath(p, root)}  {len(b):,} B  head={b[:8].hex()}")
              if b[:8] != b'ANDROID!':
                  print("   (不是 boot 镜像；前 16 字节:", b[:16].hex(), ")")
                  return
              page = struct.unpack_from('<I', b, 36)[0]
              ks = struct.unpack_from('<I', b, 8)[0]
              rs = struct.unpack_from('<I', b, 16)[0]
              ss = struct.unpack_from('<I', b, 24)[0]
              hdr = struct.unpack_from('<I', b, 40)[0]
              dtbsz = struct.unpack_from('<I', b, 64)[0]
              align = lambda v: ((v + page - 1) // page) * page
              ce = page + align(ks) + align(rs) + (align(ss) if ss else 0)
              print(f"   page={page} kernel={ks} ramdisk={rs} second={ss} hdr_ver={hdr} dtb_size@64={dtbsz}")
              print(f"   content_end={ce}  文件尾部还多 {len(b)-ce:,} B")
              k = b[page:page+ks]; r = b[page+align(ks):page+align(ks)+rs]
              print("   kernel  magic:", k[:8].hex(), "(1f8b=gzip)")
              print("   ramdisk magic:", r[:8].hex(), "(1f8b=gzip / 02214c18=lz4 / fd377a585a00=xz / 070701=裸cpio)")
              if r[:2] == b'\x1f\x8b':
                  d = zlib.decompressobj(16 + zlib.MAX_WBITS)
                  try:
                      out = d.decompress(r, 400 << 20)
                      print(f"   ramdisk gzip -> {len(out):,} B eof={d.eof} TRAILER={'TRAILER!!!' in out}")
                  except Exception as e:
                      print("   ramdisk gzip 解压失败:", e)
              tail = b[ce:ce+4096]
              print("   tail(内容终点起) 头 16 字节:", tail[:16].hex(), "(d00dfeed=FDT / d7b7ab1e=DTBO)")
              print()
          for pat in ("out/target/product/ares/*.img", "out/target/product/ares/*.zip"):
              for p in sorted(glob.glob(os.path.join(root, pat))):
                  look(p)
          PYEOF
          cat $OUT
          echo "--- 额外：设备树预编内核/DTB ---"
          md5sum device/xiaomi/ares/prebuilt/* 2>/dev/null | tee -a $OUT

      - name: 收集产物
        run: |
          if [ "${{ inputs.variant }}" = "ofox" ]; then D=$HOME/fox_12.1; else D=$HOME/rec; fi
          mkdir -p $GITHUB_WORKSPACE/artifacts
          cp -v $D/out/target/product/ares/*.img $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          cp -v $D/out/target/product/ares/*.zip $GITHUB_WORKSPACE/artifacts/ 2>/dev/null || true
          ls -lh $GITHUB_WORKSPACE/artifacts || true
          ( cd $GITHUB_WORKSPACE/artifacts && sha256sum * > SHA256SUMS.txt 2>/dev/null && cat SHA256SUMS.txt ) || true

      - name: 发 Release
        if: ${{ hashFiles('artifacts/*.img') != '' || hashFiles('artifacts/*.zip') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || format('{0}-{1}', inputs.variant, github.run_number) }}
          name: "ares ${{ inputs.variant }} (tree ${{ inputs.tree_branch }})"
          body: |
            设备树: ${{ inputs.tree_repo }}@${{ inputs.tree_branch }}
            变体: ${{ inputs.variant }}
            目标: ares (Redmi K40 Gaming / MT6893, recovery-as-boot)
          files: artifacts/*

      - name: 发布日志（无论成败，走这个 release 拿日志）
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-logs
          name: "CI logs (latest)"
          body: "每次构建的日志都会覆盖到这个 release。run ${{ github.run_number }} / ${{ inputs.variant }}"
          files: artifacts/build.log
          prerelease: true

      - name: 备用 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ares-recovery-${{ inputs.variant }}-run${{ github.run_number }}
          path: |
            artifacts/*
          compression-level: 9
          if-no-files-found: warn
